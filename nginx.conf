# Production Nginx Configuration for DrTech.Care Hospital Physical Therapy System

upstream drtech_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name hospital.drtech.care;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hospital.drtech.care;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/hospital.drtech.care/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hospital.drtech.care/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Root directory for static frontend SPAs
    root /var/www/drtechcare/public;
    index index.html;

    # Upload Body Limit for 10-frame biometric face registration (Item H10)
    client_max_body_size 15M;

    # Security Headers for SPA & API (Item H10)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none';" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self)" always;

    # 1. Server-Sent Events (SSE) Route (Item H10)
    # Strictly matched with location = /api/events and location ^~ /api/events/
    location ^~ /api/events {
        proxy_pass http://drtech_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering and cache for realtime SSE
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;

        # Disable gzip compression for SSE stream
        gzip off;
        add_header X-Accel-Buffering "no" always;
    }

    # 2. General Express 5 API Proxy
    location /api/ {
        proxy_pass http://drtech_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 3. Frontend Single Page Apps (SPA) using root + try_files (no alias)
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location /pt/ {
        try_files $uri $uri/ /pt/index.html;
    }

    location /kiosk/ {
        try_files $uri $uri/ /kiosk/index.html;
    }

    # 4. Static Landing Page & Root
    location / {
        try_files $uri $uri/ /index.html;
    }
}
