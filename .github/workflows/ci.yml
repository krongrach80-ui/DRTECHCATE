name: CI

on:
  push:
    branches: [ main, 'chore/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Supabase Migrations, pgTAP & Vitest
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      # Rule 11: No guessed FACE_T_* defaults in CI job env.
      # Fixture values are isolated and labeled in test suites.
      KIOSK_PAIRING_SECRET: test-kiosk-pairing-hmac-secret-16chars

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck & Lint
        run: |
          npm run typecheck
          npm run lint

      - name: Build Frontend Apps & Verify Zero Leaks
        env:
          NODE_ENV: production
        run: |
          npm run build:apps
          npm run ci:bundle

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Start Supabase (Docker)
        run: |
          supabase start
          # Export real dynamic keys and URLs generated by local Supabase instance
          eval $(supabase status -o env)
          echo "SUPABASE_URL=$API_URL" >> $GITHUB_ENV
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> $GITHUB_ENV
          echo "DATABASE_URL=$DB_URL" >> $GITHUB_ENV

      - name: Reset Database and Re-apply Baseline Migrations
        run: supabase db reset

      - name: Run pgTAP Database Security & RLS Tests
        run: supabase test db

      - name: Run Vitest Unit & Live Integration Tests (290 Tests — Real Postgres)
        env:
          LIVE_TESTS: '1'
        run: npx vitest run --reporter=verbose

      - name: Run Integration Tests Against Real Postgres (22 Tests — MUST NOT be skipped)
        env:
          LIVE_TESTS: '1'
        run: npx vitest run apps/api/src/__tests__/repositories_integration.test.ts apps/api/src/__tests__/live_integration.test.ts --reporter=verbose

