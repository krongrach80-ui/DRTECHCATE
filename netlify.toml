[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@supabase/supabase-js"]

# 1. Forward all /api/* requests directly to Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# 2. SPA Deep-Linking for Clinical Portals
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/pt/*"
  to = "/pt/index.html"
  status = 200

[[redirects]]
  from = "/kiosk/*"
  to = "/kiosk/index.html"
  status = 200

# 3. Root SPA Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com; connect-src 'self' https://*.supabase.co https://storage.googleapis.com https://cdn.jsdelivr.net https://unpkg.com blob: data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com;"
    X-Data-Sovereignty = "Zero-Video-PIPL-Compliant"
    X-China-GFW-Immunity = "Multi-CDN-Enforced"
